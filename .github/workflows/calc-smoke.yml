# Smoke test: prove every calculator actually loads AND computes the RIGHT
# numbers — no NaN, no JS errors, no blank outputs, and the default-input
# headline figures still match their known-correct values (tools/calc-golden.json).
# That value-assertion is the part NaN-checks miss: a formula regression that
# returns a wrong-but-finite number. Complements smoke.yml (homepage charts).
# Pure client-side (no Worker fetch), so it's fast and deterministic: it serves
# THIS commit's HTML and drives each tool with a real browser.
#
# Runs on every push to main + on demand. Fails (and emails you) if any of the
# 16 calculators throws, shows NaN/undefined/Infinity, has no inputs, or drifts
# from its golden output.

name: Smoke test — calculators compute

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  calc-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright (Chromium) + static server
        run: |
          npm install --no-save playwright http-server
          npx playwright install --with-deps chromium

      - name: Serve this commit and smoke-test every calculator
        run: |
          npx http-server . -p 8080 -s &
          sleep 3
          cat > calc-smoke.js <<'EOF'
          const { chromium } = require('playwright');
          const TOOLS = [
            'reverse-dcf', 'through-cycle-pt', 'epv', 'accretion-dilution', 'position-sizing',
            'comps', 'lbo', 'wacc', 'dcf', 'football', 'midcycle',
            'pe-cap-table', 'pe-qofe', 'pe-distribution-waterfall', 'pe-returns-waterfall', 'pe-reverse-lbo'
          ];
          const GOLDEN = require('./tools/calc-golden.json');  // known-correct default-input figures
          (async () => {
            const browser = await chromium.launch();
            const fails = [];
            for (const t of TOOLS) {
              const page = await browser.newPage();
              const errors = [];
              // Block EVERY off-origin request — fonts, the Substack subscribe iframe (X-Frame-Options),
              // the Cloudflare RUM beacon (cloudflareinsights, CORS-blocked on localhost), analytics.
              // The calculators are pure client-side, so none of it affects compute or the golden
              // outputs — but on localhost these external hits throw console errors that false-fail the run.
              await page.route('**/*', r => {
                const u = r.request().url();
                return /^(http:\/\/localhost|http:\/\/127\.0\.0\.1|data:)/.test(u) ? r.continue() : r.abort();
              }).catch(() => {});
              page.on('pageerror', e => errors.push(String(e).slice(0, 100)));
              // Backstop: only genuine same-origin JS errors count — ignore external-resource noise
              // (blocked requests, framing/CORS refusals from the Substack iframe + CF beacon).
              page.on('console', m => { if (m.type() === 'error' && !/Failed to load resource|net::ERR|X-Frame-Options|Refused to (display|load|connect)|blocked by CORS|cloudflareinsights|cdn-cgi/i.test(m.text())) errors.push(m.text().slice(0, 100)); });
              try {
                await page.goto('http://localhost:8080/' + t + '.html', { waitUntil: 'load', timeout: 30000 });
                await page.waitForTimeout(900); // let on-load compute + scripts settle
                const txt = await page.evaluate(() => document.body.innerText);
                const hasInput = await page.evaluate(() => !!document.querySelector('input'));
                if (!hasInput) fails.push(t + ': no inputs found (page broken?)');
                if (/\bNaN\b/.test(txt)) fails.push(t + ': shows NaN on load');
                if (/\bundefined\b/.test(txt)) fails.push(t + ': shows "undefined" on load');
                if (/\bInfinity\b/.test(txt)) fails.push(t + ': shows Infinity on load');
                // Value-assertion: the default-input output must still contain its known-correct
                // figures — catches a "computes the WRONG number" regression the checks above miss.
                for (const g of (GOLDEN[t] || [])) {
                  if (!txt.includes(g)) fails.push(t + ': output no longer contains "' + g + '" — value drift; if you changed a default/formula, update tools/calc-golden.json');
                }
                if (errors.length) fails.push(t + ': JS error — ' + errors[0]);
                else console.log('OK  ' + t);
              } catch (e) {
                fails.push(t + ': failed to load — ' + String(e).slice(0, 100));
              }
              await page.close();
            }
            await browser.close();
            if (fails.length) {
              console.error('\nCALCULATOR SMOKE TEST FAILED:\n - ' + fails.join('\n - '));
              process.exit(1);
            }
            console.log('\nSmoke test passed — all ' + TOOLS.length + ' calculators load, compute cleanly, and match their golden outputs.');
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
          node calc-smoke.js
