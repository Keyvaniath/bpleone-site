# Belt-and-suspenders: regenerate manifests on every push to main and
# fail the workflow if they would have changed (i.e. the contributor
# forgot to enable the local pre-commit hook). Runs in ~10 seconds.
#
# This intentionally does NOT auto-commit back. The Cloudflare Pages
# build command (npm run manifests) is the runtime source of truth;
# this job just nags you in CI.

name: Verify manifests are fresh

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate manifests
        run: npm run manifests
      - name: Warn if structural manifest diff (file count or size changed)
        run: |
          # Only flag if file count or sizes actually changed, ignoring the date-only
          # "generated" / "modified" fields which auto-update every run.
          # We use jq to strip the volatile fields, then diff the canonicalized JSON.
          if ! command -v jq >/dev/null 2>&1; then sudo apt-get install -y jq >/dev/null 2>&1; fi
          for f in assets/reports/manifest.json assets/site-index.json; do
            git show HEAD:"$f" 2>/dev/null | jq 'del(.generated, .files[]?.modified)' > /tmp/before.json || true
            jq 'del(.generated, .files[]?.modified)' "$f" > /tmp/after.json
            if ! diff -q /tmp/before.json /tmp/after.json >/dev/null 2>&1; then
              echo "::warning::$f has structural changes (files added, removed, or resized)."
              diff /tmp/before.json /tmp/after.json | head -40 || true
            fi
          done
          echo "Manifest verification complete (warnings only — date-only mtime drift is ignored)."
